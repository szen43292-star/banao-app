<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14162B">
<title>Banao</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" id="banao-fonts" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Archivo+Black&family=Archivo:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&family=Nunito:wght@400;600;800&family=Sora:wght@400;600;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="banao-css">
/* Layout: a workbench. A centred brief card on a quiet dotted ground, ready designs below as real miniature screens, and a two-pane bench for editing with the live screen on the right. */
:root{
  --ground:#F2F3F7; --sheet:#FFFFFF; --sunk:#F6F7FA; --ink:#14162B; --ink-2:#33385A; --muted:#5E6483; --line:#E1E4EC; --line-2:#C9CEDC;
  --brick:#F2A900; --on-brick:#231A00; --brick-ink:#8A5D00; --brick-soft:#FFF2CC;
  --k-web:#3D41B5; --k-soft:#8A5D00; --ok:#137A47; --danger:#B42318;
  --dot:rgba(20,22,43,.09); --glow:rgba(242,169,0,.16); --ring:rgba(242,169,0,.34); --scrim:rgba(8,10,22,.5);
  --shadow:0 1px 2px rgba(20,22,43,.05),0 14px 34px -16px rgba(20,22,43,.22);
  --shadow-lg:0 2px 4px rgba(20,22,43,.04),0 30px 60px -28px rgba(20,22,43,.32);
  --f-disp:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D0F1C; --sheet:#161A2E; --sunk:#111427; --ink:#ECEEF8; --ink-2:#C7CBE3; --muted:#969CBA; --line:#262B47; --line-2:#39405F;
    --brick:#F6B51E; --on-brick:#1A1300; --brick-ink:#F6C251; --brick-soft:#33280A;
    --k-web:#A3A6FF; --k-soft:#F6C251; --ok:#4ADE80; --danger:#FF8A80;
    --dot:rgba(236,238,248,.07); --glow:rgba(246,181,30,.10); --ring:rgba(246,181,30,.38); --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 36px -16px rgba(0,0,0,.7); --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 30px 60px -26px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D0F1C; --sheet:#161A2E; --sunk:#111427; --ink:#ECEEF8; --ink-2:#C7CBE3; --muted:#969CBA; --line:#262B47; --line-2:#39405F;
  --brick:#F6B51E; --on-brick:#1A1300; --brick-ink:#F6C251; --brick-soft:#33280A;
  --k-web:#A3A6FF; --k-soft:#F6C251; --ok:#4ADE80; --danger:#FF8A80;
  --dot:rgba(236,238,248,.07); --glow:rgba(246,181,30,.10); --ring:rgba(246,181,30,.38); --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 36px -16px rgba(0,0,0,.7); --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 30px 60px -26px rgba(0,0,0,.8); color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ground)}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,h4,p{margin:0}
.ic{width:18px;height:18px;flex:none}
.mono{font-family:var(--f-mono)}
.small{font-size:12.5px;color:var(--muted)}
.page{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;height:64px}
.logo{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:23px;letter-spacing:-.03em}
.logo:focus-visible{outline:3px solid var(--brick);outline-offset:4px;border-radius:8px}
.logo svg{width:32px;height:32px;flex:none}
.logo small{font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:0;color:var(--muted);padding:3px 8px;border:1px solid var(--line-2);border-radius:99px;margin-left:2px}
.tabs{display:flex;gap:2px;margin-left:auto;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--ground)}
.tabs button:focus-visible{outline:3px solid var(--brick)}
.tabs em{font-style:normal;font-family:var(--f-mono);font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--brick);color:var(--on-brick);display:inline-grid;place-items:center}
.tabs em:empty{display:none}

/* buttons */
.b{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:11px;font-weight:700;font-size:14.5px;white-space:nowrap;transition:transform .12s ease,filter .12s ease,background .12s,border-color .12s}
.b:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
.b-acc{background:var(--brick);color:var(--on-brick);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.b-acc:hover{filter:brightness(1.05);transform:translateY(-1px)}
.b-ink{background:var(--ink);color:var(--ground)}
.b-ink:hover{transform:translateY(-1px)}
.b-ghost{border:1px solid var(--line-2);background:var(--sheet);color:var(--ink)}
.b-ghost:hover{border-color:var(--ink-2)}
.b[disabled]{opacity:.55;cursor:default;transform:none}
.b-lg{min-height:50px;padding:0 22px;font-size:16px;border-radius:13px}
.b-danger{background:var(--danger);color:#fff}
.b-sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}

/* home */
.hero{position:relative;isolation:isolate;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse 70% 80% at 50% 30%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse 70% 80% at 50% 30%,#000 30%,transparent 75%)}
.hero::after{content:"";position:absolute;left:50%;top:-180px;width:900px;height:520px;transform:translateX(-50%);z-index:-1;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.hero-in{max-width:860px;margin:0 auto;padding-block:58px 40px;text-align:center;display:flex;flex-direction:column;align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:99px;background:var(--sheet);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);box-shadow:var(--shadow)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.hd{font-family:var(--f-disp);font-weight:800;font-size:clamp(36px,6.4vw,74px);line-height:.98;letter-spacing:-.04em;margin-top:22px;text-wrap:balance}
.hd .hl{position:relative;white-space:nowrap;color:var(--ink)}
.hd .hl::after{content:"";position:absolute;left:-2%;right:-2%;bottom:-.08em;height:.32em;z-index:-1;background:var(--brick);border-radius:4px;transform:skewX(-8deg) rotate(-1deg);opacity:.92}
.sub{font-size:clamp(16px,1.6vw,18.5px);color:var(--muted);max-width:36em;margin-top:20px;line-height:1.6;text-wrap:pretty}
.composer{width:100%;margin-top:32px;background:var(--sheet);border:1.5px solid var(--line-2);border-radius:22px;box-shadow:var(--shadow-lg);text-align:left;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--brick);box-shadow:0 0 0 5px var(--ring),var(--shadow-lg)}
.prompt{display:block;width:100%;min-height:118px;font:inherit;font-size:18.5px;line-height:1.5;padding:20px 22px 8px;border:0;background:transparent;color:var(--ink);resize:vertical;border-radius:22px 22px 0 0}
.prompt:focus{outline:none}
.prompt::placeholder{color:var(--muted)}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 12px 14px;flex-wrap:wrap}
.c-note{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.c-note .ic{width:16px;height:16px;color:var(--ok)}
.err-line{color:var(--danger);font-size:14px;margin-top:12px;font-weight:600}
.ex{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px;max-width:800px}
.ex-l{font-size:13px;color:var(--muted);font-weight:600;align-self:center;margin-right:2px}
.exb{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 9px;border-radius:99px;background:var(--sheet);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-2);transition:border-color .12s,transform .12s}
.exb .ic{width:16px;height:16px;color:var(--brick-ink)}
.exb:hover{border-color:var(--line-2);color:var(--ink);transform:translateY(-1px)}
.exb:focus-visible{outline:3px solid var(--brick)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button .ic{width:16px;height:16px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.seg button:focus-visible{outline:3px solid var(--brick)}
.seg em{font-style:normal;font-family:var(--f-mono);font-size:11px;opacity:.7}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0 0;padding:0;list-style:none}
.how li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:16px 18px;background:var(--sheet);border:1px solid var(--line);border-radius:16px}
.how b{display:block;font-size:15px}
.how span{font-size:13.5px;color:var(--muted);line-height:1.45}
.how .n{width:30px;height:30px;border-radius:9px;background:var(--brick-soft);color:var(--brick-ink);font-family:var(--f-mono);font-weight:600;font-size:13px;display:grid;place-items:center;flex:none}
.gal-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin:52px 0 18px}
.gal-head h2{font-family:var(--f-disp);font-weight:800;font-size:clamp(26px,3.2vw,36px);letter-spacing:-.03em;line-height:1.05}
.gal-head p{color:var(--muted);margin-top:6px;font-size:14.5px}
.gal-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.find{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--sheet);width:min(280px,100%);color:var(--muted)}
.find:focus-within{border-color:var(--brick);box-shadow:0 0 0 3px var(--ring)}
.find input{all:unset;flex:1;min-width:0;color:var(--ink);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;padding-bottom:64px}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:12px;border-radius:18px;padding:10px 10px 14px;background:var(--sheet);border:1px solid var(--line);transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line-2)}
.tcard:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
.tmeta{padding:0 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tmeta h3{font-size:16px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tmeta h3 .ic{width:16px;height:16px;color:var(--muted);transition:transform .15s,color .15s}
.tcard:hover .tmeta h3 .ic{transform:translateX(3px);color:var(--ink)}
.tmeta p{font-size:13.5px;color:var(--muted);line-height:1.45}
.kind{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.kind::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}
.k-web{color:var(--k-web)}.k-soft{color:var(--k-soft)}

/* live miniature screens */
.lt{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:11px;background:var(--sunk);border:1px solid var(--line);isolation:isolate}
.lt::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--sheet) 70%,transparent) 50%,transparent 70%) 0 0/220% 100%;animation:sheen 1.4s linear infinite;z-index:2}
.lt.on::after{display:none}
.lt-stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform:scale(var(--lts,.21));transform-origin:0 0;pointer-events:none;background:#fff}
@keyframes sheen{to{background-position:-220% 0}}

/* build screen */
.build{padding-block:56px 80px;display:flex;justify-content:center}
.bcard{width:min(680px,100%);background:var(--sheet);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:28px}
.bcard .hd{font-size:clamp(30px,4.4vw,46px);margin-top:10px;text-align:left}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--brick);flex:none}
.bquote{margin-top:14px;font-size:16px;color:var(--ink-2);background:var(--sunk);border-radius:12px;padding:12px 14px;overflow-wrap:anywhere}
.bsteps{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column}
.bsteps li{display:grid;grid-template-columns:26px 110px minmax(0,1fr);gap:12px;align-items:start;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14.5px;color:var(--muted);opacity:.45;transition:opacity .2s}
.bsteps li:last-child{border-bottom:0}
.bsteps li b{font-weight:600;color:var(--muted)}
.bsteps li span{overflow-wrap:anywhere}
.bsteps .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center}
.bsteps li.done{opacity:1;color:var(--ink)}
.bsteps li.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.bsteps li.done .st .ic{width:13px;height:13px}
.bsteps li.now{opacity:1}
.bsteps li.now .st{border-color:var(--brick);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.b-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center;justify-content:space-between}

/* editor */
.ed-bar{display:flex;align-items:center;gap:12px;padding-block:14px}
.ed-title{display:flex;flex-direction:column;min-width:0;flex:1}
.ed-title b{font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.ed-body{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start;padding-bottom:28px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:18px;overflow:auto;max-height:calc(100vh - 160px);position:sticky;top:80px;overscroll-behavior:contain}
.stage{min-width:0;position:sticky;top:80px}
.cmd{display:flex;gap:8px;align-items:center;background:var(--sheet);border:1.5px solid var(--line-2);border-radius:15px;padding:6px 6px 6px 14px}
.cmd:focus-within{border-color:var(--brick);box-shadow:0 0 0 4px var(--ring)}
.cmd>.ic{color:var(--brick-ink)}
.cmd input{all:unset;flex:1;min-width:0;font-size:15px;color:var(--ink);padding:8px 0}
.cmd input::placeholder{color:var(--muted)}
.cmd-hints{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.cmd-hints::after{content:"";flex:0 0 36px}
.cmd-hints::-webkit-scrollbar{display:none}
.hint{all:unset;box-sizing:border-box;cursor:pointer;white-space:nowrap;padding:5px 10px;border-radius:99px;border:1px dashed var(--line-2);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.hint:hover{border-style:solid;border-color:var(--ink-2);color:var(--ink)}
.hint:focus-visible{outline:3px solid var(--brick)}
.cmd-msg{font-size:13.5px;color:var(--ink-2);margin:8px 2px 0;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.cmd-msg:empty{display:none}
.cmd-msg .ic{width:16px;height:16px;margin-top:2px;color:var(--ok)}
.cmd-msg.warn .ic{color:var(--brick-ink)}
.cmd-msg ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.pv-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 10px;flex-wrap:wrap}
.pv-frame{position:relative;height:calc(100vh - 300px);min-height:440px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background-color:var(--sunk);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:20px 20px}
.pv-frame.flash::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 3px var(--brick);animation:flash .9s ease forwards;pointer-events:none;z-index:5}
@keyframes flash{from{opacity:1}to{opacity:0}}
.pv-stage{position:absolute;top:0;left:0;transform-origin:0 0;background:#fff}
.pv-frame.phone .pv-stage{border-radius:26px;box-shadow:0 0 0 8px #1A1D2D,0 26px 50px -20px rgba(0,0,0,.55);overflow:hidden}
.pv-host{display:block;width:100%;height:100%;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.pv-frame.phone .pv-host{border-radius:26px;clip-path:inset(0 round 26px)}
.grp{border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;font-weight:700;font-size:14.5px;color:var(--ink)}
.grp>summary .ic{width:17px;height:17px;color:var(--muted)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.grp[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.grp>summary:hover{background:var(--sunk)}
.grp>summary:focus-visible{outline:3px solid var(--brick);outline-offset:-3px}
.gb{padding:2px 18px 18px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.in{font:inherit;font-weight:400;font-size:14.5px;color:var(--ink);background:var(--sunk);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;min-height:40px;width:100%}
.in:focus{outline:none;border-color:var(--brick);box-shadow:0 0 0 3px var(--ring);background:var(--sheet)}
textarea.in{min-height:78px;resize:vertical;line-height:1.45}
select.in{appearance:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lab{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:-4px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swb{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.swb.on{outline:2.5px solid var(--ink);outline-offset:2px}
.swb:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
.swpick{position:relative;width:28px;height:28px;border-radius:50%;overflow:hidden;background:conic-gradient(#e53935,#fdd835,#43a047,#00acc1,#3949ab,#d81b60,#e53935);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.swpick input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);opacity:0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 11px;border-radius:9px;border:1px solid var(--line-2);font-size:13px;font-weight:600;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chipb:hover{border-color:var(--ink-2)}
.chipb.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chipb:focus-visible{outline:3px solid var(--brick)}
.chipb.more{border-style:dashed}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.tog input{appearance:none;-webkit-appearance:none;margin:0;width:40px;height:24px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog input:checked{background:var(--brick)}
.tog input:checked::after{transform:translateX(16px)}
.tog input:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px;background:var(--sunk)}
.item-h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.item-h .acts{display:flex;gap:2px;align-items:center}
.item .in{background:var(--sheet);min-height:36px;padding:7px 10px;font-size:14px}
.item textarea.in{min-height:60px}
.item .ph{width:34px;height:26px;border-radius:5px;object-fit:cover;border:1px solid var(--line)}
.mini{all:unset;box-sizing:border-box;cursor:pointer;min-width:28px;height:28px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:7px;color:var(--muted);font-family:var(--f-body);font-size:12px;font-weight:600;position:relative;overflow:hidden}
.mini:hover{background:var(--line);color:var(--ink)}
.mini:focus-visible,.mini:focus-within{outline:3px solid var(--brick)}
.mini .ic{width:16px;height:16px}
.mini input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.addb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:1px dashed var(--line-2);border-radius:12px;font-weight:600;font-size:13.5px;color:var(--ink-2);position:relative;overflow:hidden}
.addb:hover{border-color:var(--ink-2);color:var(--ink)}
.addb:focus-visible,.addb:focus-within{outline:3px solid var(--brick)}
.addb input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.modrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.modrow .tog{gap:0}
.img-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.img-ctl img{width:64px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.gal-ed{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gal-ed figure{margin:0;position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.gal-ed img{width:100%;height:100%;object-fit:cover}
.gal-ed button{all:unset;cursor:pointer;position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.gal-ed button .ic{width:13px;height:13px}
.filelabel{position:relative;overflow:hidden}
.filelabel input{position:absolute;inset:0;opacity:0;cursor:pointer}
.jump{display:none}

/* projects */
.proj-head{padding-block:44px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.proj-head .hd{font-size:clamp(30px,4.4vw,48px);margin-top:10px}
.proj{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding-bottom:64px}
.pcard{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:10px 10px 14px;display:flex;flex-direction:column;gap:12px}
.pcard .tmeta{flex:1}
.pact{display:flex;gap:6px;padding:0 6px;flex-wrap:wrap}
.pact .b{padding:0 11px}
.pact .b:last-child{margin-left:auto}
.empty-st{border:1px dashed var(--line-2);border-radius:18px;padding:44px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:64px;background:var(--sheet)}
.empty-st h2{color:var(--ink);font-family:var(--f-disp);font-size:26px;letter-spacing:-.025em}

/* footer */
.foot{border-top:1px solid var(--line);padding-block:26px 34px;color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.foot b{color:var(--ink)}

/* modal + toast */
.m-scrim{position:fixed;inset:0;background:var(--scrim);z-index:80}
.m-box{position:fixed;z-index:81;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;background:var(--sheet);border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:24px}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.m-head h2{font-family:var(--f-disp);font-weight:800;font-size:27px;letter-spacing:-.025em;line-height:1.1}
.file{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--sunk)}
.fi{width:42px;height:52px;border-radius:5px 12px 5px 5px;background:var(--brick);color:var(--on-brick);display:grid;place-items:end center;padding-bottom:7px;font-family:var(--f-mono);font-size:10px;font-weight:600;flex:none}
.file b{display:block;font-size:15px;overflow-wrap:anywhere}
.file span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.m-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.m-msg{font-size:13.5px;margin-top:10px;color:var(--ink-2)}
.m-msg:empty{display:none}
.steps{counter-reset:s;list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;line-height:1.5}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--ground);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.steps a{color:var(--ink);font-weight:700}
.codebox{margin-top:16px}
.codebox summary{cursor:pointer;font-weight:600;font-size:14px}
.code{display:block;width:100%;height:220px;margin-top:10px;font-family:var(--f-mono);font-size:11.5px;line-height:1.5;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);resize:vertical;white-space:pre;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width: 960px){
  .ed-body{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;max-height:none}
  .stage{position:static;order:-1}
  .pv-frame{height:68vh;min-height:420px}
  .jump.show{display:inline-flex}
  .jump{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;box-shadow:var(--shadow-lg)}
  .how{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 600px){
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .logo small,.get-l{display:none}
  .tabs button{padding:7px 10px;font-size:13.5px}
  .hero-in{padding-block:36px 28px}
  .prompt{font-size:16.5px;min-height:112px;padding:16px 16px 6px}
  .c-foot{padding:8px 10px 10px}
  .c-foot .seg{width:100%}
  .c-foot .seg button{flex:1;justify-content:center}
  .c-foot .b-lg{width:100%}
  .ex-l{display:none}
  .ed-bar .b span{display:none}
  .ed-bar .b{padding:0 12px}
  .bsteps li{grid-template-columns:24px minmax(0,1fr)}
  .bsteps li b{grid-column:2}
  .bsteps li span{grid-column:2;margin-top:-8px}
  .bcard{padding:20px}
  .m-box{top:auto;bottom:0;left:0;right:0;transform:none;width:auto;border-radius:20px 20px 0 0;max-height:90vh;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .gal-ed{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

</header>

.hc-feat{background:var(--soft);color:var(--ink)}
.hc-info{background:var(--p);color:var(--onP)}
.hf-k{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pText);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-feat h4{font-size:16px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.hc-feat small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.hf-row{display:flex;align-items:center;gap:12px;min-width:0}
.hf-row>div{min-width:0}
.hf-pic{position:relative;width:54px;height:54px;border-radius:calc(var(--r) * .6 + 4px);overflow:hidden;display:grid;place-items:center;background:var(--bg);color:var(--pText);flex:none}
.hf-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hf-pic .ic{width:50%;height:50%;stroke-width:1.4}
.hf-pic.avatar{border-radius:50%;margin:0;font-size:17px}
.hc-feat .price{font-size:18px}
.hc-feat .mc-menu li{padding:6px 0;font-size:14px}
.hf-time{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--muted)}
.hc-info ul{display:flex;flex-direction:column;gap:10px}
.hc-info li{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14.5px;line-height:1.35}
.hc-info li .ic{width:18px;height:18px;margin-top:1px;opacity:.85}
.hc-info small{font-size:13.5px;line-height:1.45;opacity:.9}
.mc-tile{position:relative;aspect-ratio:16/10;border-radius:calc(var(--r) * .7 + 2px);overflow:hidden;display:grid;place-items:center;color:var(--pText);margin-bottom:14px}
.mc-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mc-tile::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,var(--dot) 1.2px,transparent 0) 0 0/16px 16px}
.mc-tile .ti{position:relative;width:34%;aspect-ratio:1;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 14px 30px -18px var(--shadow)}
.mc-tile .ti .ic{width:48%;height:48%;stroke-width:1.3}
.mc h4{font-size:16.5px;font-weight:700;line-height:1.3}
.mc small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.mc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.mc-row .price{font-size:19px}
.mc-person{display:flex;gap:12px;align-items:center}
.mc-person .avatar{width:54px;height:54px;font-size:17px;margin:0}
.mc-time{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:14px;padding:10px 12px;border-radius:calc(var(--r) * .6);background:var(--soft)}
.mc-menu li{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line2);font-size:14.5px}
.mc-menu li:last-child{border-bottom:0}
.mc-menu li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mc-menu li b{font-variant-numeric:tabular-nums}
.mc-head{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pTextCard);margin-bottom:6px}
.mc-plan .amt{font-size:30px;margin:6px 0 10px}
.mc-plan li{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.mc-plan li .ic{color:var(--pTextCard)}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:76px;border-top:1px solid var(--line)}
.hstat{padding:26px 24px 30px;border-left:1px solid var(--line)}
.hstat:first-child{border-left:0;padding-left:0}
.hstat b{display:block;font-family:var(--hf);font-weight:var(--hw);font-size:clamp(28px,3cqi,38px);line-height:1.1;letter-spacing:var(--hls);color:var(--pText)}
.hstat span{font-size:14px;color:var(--muted)}
.marq{border-block:1px solid var(--line);background:var(--card);overflow:hidden;padding:20px 0}
.marq-in{display:flex;width:max-content;animation:marq 42s linear infinite}
.marq-in span{display:inline-flex;align-items:center;gap:40px;padding-right:40px;white-space:nowrap;font-family:var(--hf);font-weight:var(--hw);font-size:22px;letter-spacing:var(--hls)}
.marq-in span::after{content:"✦";color:var(--a);font-size:15px}
@keyframes marq{to{transform:translateX(-50%)}}
.sec{padding:112px 0}
.sec-alt{background:var(--soft)}
.sec-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px 64px;align-items:end;margin-bottom:56px}
.sec-head p{color:var(--muted);font-size:17px;max-width:30em}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pText);margin-bottom:16px}
.kicker::before{content:"";width:22px;height:2px;background:currentColor}
.h2{font-family:var(--hf);font-weight:var(--hw);font-size:clamp(32px,4.1cqi,54px);line-height:1.06;letter-spacing:var(--hls2);text-wrap:balance}
.site h3{font-family:var(--bf);font-size:18.5px;font-weight:700;line-height:1.3;letter-spacing:-.005em}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:20px}
.svc{position:relative;padding:32px 28px 30px;border-radius:calc(var(--r) + 4px);background:var(--card);border:1px solid var(--line);transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.svc:hover{transform:translateY(-4px);box-shadow:0 26px 50px -32px var(--shadow);border-color:var(--line2)}
.si{width:56px;height:56px;border-radius:calc(var(--r) * .8);display:grid;place-items:center;background:var(--soft);color:var(--pTextCard);margin-bottom:28px}
.si .ic{width:26px;height:26px}
.svc p{color:var(--muted);font-size:15.5px;margin-top:8px}
.person{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);padding:26px;display:flex;flex-direction:column;gap:4px}
.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:23px;margin-bottom:16px;letter-spacing:.02em}
.person .role{color:var(--muted);font-size:14.5px}
.person .time{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line2)}
.person .lnk{margin-top:auto;padding-top:16px;font-weight:650;color:var(--pTextCard);font-size:14.5px;display:inline-flex;gap:6px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 26px 50px -32px var(--shadow)}
.tile{aspect-ratio:4/3;position:relative;display:grid;place-items:center;overflow:hidden;color:var(--pText)}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,var(--dot) 1.2px,transparent 0) 0 0/18px 18px;opacity:.9}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.tile .ti{position:relative;width:38%;aspect-ratio:1;display:grid;place-items:center;color:var(--pText)}
.tile .ti .ic{width:100%;height:100%;stroke-width:1}
.t0{background:linear-gradient(145deg,var(--t0a),var(--t0b))}.t1{background:linear-gradient(145deg,var(--t1a),var(--t1b))}.t2{background:linear-gradient(145deg,var(--t2a),var(--t2b))}
.tag{position:absolute;z-index:2;top:14px;left:14px;padding:5px 12px;border-radius:999px;background:var(--a);color:var(--onA);font-size:12px;font-weight:700;box-shadow:0 6px 14px -8px var(--shadow)}
.card-b{padding:22px 24px 24px;display:flex;flex-direction:column;gap:4px;flex:1}
.meta{color:var(--muted);font-size:14.5px}
.card-f{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:20px;flex-wrap:wrap}
.price{font-family:var(--hf);font-weight:var(--hw);font-size:20px;letter-spacing:var(--hls);font-variant-numeric:tabular-nums}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:0 64px}
.mi{padding:22px 0;border-bottom:1px dashed var(--line2)}
.mi-top{display:flex;align-items:baseline;gap:12px}
.mi-top .dots{flex:1;min-width:20px;border-bottom:2px dotted var(--line2);transform:translateY(-5px)}
.mi p{color:var(--muted);font-size:14.5px;margin-top:4px}
.mi em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pText);margin-left:10px;white-space:nowrap;vertical-align:2px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);padding:34px 30px;display:flex;flex-direction:column;gap:16px;position:relative}
.plan.hot{background:var(--hotBg);color:var(--hotInk);border-color:transparent;box-shadow:0 30px 60px -30px var(--shadowP)}
.plan.hot li .ic{color:var(--a)}
.plan.hot .btn-p{background:var(--a);color:var(--onA)}
.badge{position:absolute;top:-13px;left:28px;background:var(--a);color:var(--onA);font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px}
.amt{font-family:var(--hf);font-weight:var(--hw);font-size:36px;line-height:1.1;letter-spacing:var(--hls)}
.plan ul{display:flex;flex-direction:column;gap:10px;font-size:15px}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li .ic{color:var(--pTextCard);margin-top:3px}
.plan .btn{margin-top:auto}
.about{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:72px;align-items:center}
.about-vis{position:relative;aspect-ratio:1/1.05;border-radius:calc(var(--r) * 2 + 10px);overflow:hidden;isolation:isolate;background:radial-gradient(circle at 80% 10%,var(--g1),transparent 50%),radial-gradient(circle at 10% 90%,var(--g2),transparent 55%),linear-gradient(200deg,var(--g3),var(--g4))}
.about-vis::before{content:"";position:absolute;inset:0;background-image:${NOISE};opacity:.07;z-index:0;pointer-events:none}
.about-vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.about-art{position:relative}
.about-vis .hc-icon{right:10%;top:10%;width:38%;transform:none}
.about-text p{font-size:17.5px;color:var(--muted);margin-top:20px;max-width:34em}
.points{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.point{display:flex;gap:14px;align-items:center;font-weight:600}
.point i{width:30px;height:30px;border-radius:50%;background:var(--p);color:var(--onP);display:grid;place-items:center;flex:none}
.point i .ic{width:16px;height:16px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);padding:30px;display:flex;flex-direction:column;gap:18px;position:relative}
.rev::before{content:"\\201C";position:absolute;right:24px;top:6px;font-family:Georgia,serif;font-size:90px;line-height:1;color:var(--softA)}
.rev blockquote{font-size:16.5px;line-height:1.6;position:relative}
.who{margin-top:auto;display:flex;gap:12px;align-items:center;font-size:14px}
.who .avatar{width:42px;height:42px;font-size:14px;margin:0}
.who b{display:block}
.who span{color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:220px;gap:14px}
.gal figure{border-radius:calc(var(--r) + 2px);overflow:hidden;background:var(--soft)}
.gal figure:first-child{grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover}
.faq{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:64px;align-items:start}
.faq-side p{color:var(--muted);margin-top:16px;max-width:24em}
.qa{border-bottom:1px solid var(--line2)}
.qa:first-child{border-top:1px solid var(--line2)}
.qa summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;font-weight:650;font-size:17.5px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--pTextCard);font-size:20px;font-weight:500;transition:transform .2s}
.qa[open] summary::after{transform:rotate(45deg)}
.qa p{padding:0 48px 24px 0;color:var(--muted)}
.cta-band{padding:0 0 112px}
.cta-box{position:relative;overflow:hidden;isolation:isolate;border-radius:calc(var(--r) * 2 + 10px);background:var(--p);color:var(--onP);padding:64px;display:grid;grid-template-columns:minmax(0,1.2fr) auto;gap:32px;align-items:center}
.cta-box::before{content:"";position:absolute;width:90%;aspect-ratio:1;right:-30%;top:-60%;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 34px,var(--ctaLine) 34px 35px);z-index:-1}
.cta-box::after{content:"";position:absolute;inset:0;background-image:${NOISE};opacity:.06;z-index:-1;pointer-events:none}
.cta-box h2{font-family:var(--hf);font-weight:var(--hw);font-size:clamp(28px,3.4cqi,46px);line-height:1.08;letter-spacing:var(--hls2);text-wrap:balance}
.cta-box p{opacity:.86;margin-top:12px;font-size:17px}
.cta-box .cta-row{margin-top:0;justify-content:flex-end}
.cta-box .btn-p{background:var(--onP);color:var(--p);box-shadow:none}
.cta-box .btn-g{background:transparent;color:var(--onP);border-color:currentColor}
.contact{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:64px;align-items:start}
.info{display:flex;flex-direction:column;gap:18px;margin-top:32px}
.info li{display:flex;gap:14px;align-items:flex-start}
.ii{width:48px;height:48px;border-radius:calc(var(--r) * .75);background:var(--soft);color:var(--pText);display:grid;place-items:center;flex:none}
.info small{display:block;color:var(--muted);font-size:13px}
.info b{font-weight:600;overflow-wrap:anywhere}
.c-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.pay{margin-top:28px;display:flex;gap:18px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:calc(var(--r) + 2px);background:var(--card)}
.pay .qr{width:128px;flex:none;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.pay .qr svg{display:block;width:100%;height:auto}
.pay b{display:block;font-size:17px}
.pay code{display:inline-block;margin-top:6px;font-size:14px;padding:4px 8px;border-radius:6px;background:var(--soft);overflow-wrap:anywhere}
.pay small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.copy{margin-top:8px;font-size:13px;font-weight:650;color:var(--pTextCard);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.form{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r) * 1.2 + 4px);padding:34px;display:grid;grid-template-columns:1fr 1fr;gap:16px;box-shadow:0 30px 70px -50px var(--shadow)}
.form h3{grid-column:1/-1;font-family:var(--hf);font-weight:var(--hw);font-size:26px;letter-spacing:var(--hls)}
.fld{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:600;min-width:0}
.fld.full,.form .btn,.form-ok{grid-column:1/-1}
.fld input,.fld select,.fld textarea{font:inherit;font-weight:400;font-size:15.5px;padding:12px 14px;border-radius:calc(var(--r) * .55);border:1.5px solid var(--line2);background:var(--bg);color:var(--ink);width:100%;min-height:50px}
.fld textarea{min-height:120px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--ring)}
.fld [aria-invalid=true]{border-color:#D92D20}
.form-ok{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r);background:var(--soft)}
.form-ok .ic{color:var(--pText);width:26px;height:26px}
.form-ok a{display:inline-flex;margin-top:10px}
.foot{background:var(--footBg);color:var(--footInk);padding:80px 0 32px}
.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:48px}
.foot .brand{font-size:24px}
.foot .mark{background:var(--a);color:var(--onA)}
.foot p,.foot li{opacity:.78;font-size:14.5px}
.foot h4{margin:0 0 14px;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.foot ul{display:flex;flex-direction:column;gap:9px}
.foot-b{margin-top:56px;padding-top:22px;border-top:1px solid var(--footLine);font-size:13px;opacity:.65;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wa-float{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 16px 34px -12px rgba(0,0,0,.5);transition:transform .2s}
.wa-float:hover{transform:scale(1.06)}
.wa-float .ic{width:32px;height:32px}
/* --- bold --- */
.s-bold .hero{background:var(--p);color:var(--onP)}
.s-bold .hero::before{display:none}
.s-bold .pill{background:var(--a);color:var(--onA);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.s-bold .pill i{background:var(--ink);box-shadow:none}
.s-bold .hero h1{text-transform:uppercase;font-size:clamp(44px,7.6cqi,108px);line-height:.93}
.s-bold .hero h1 em{color:var(--aOnP)}
.s-bold .hero .lead,.s-bold .trust{color:var(--onP);opacity:.88}
.s-bold .trust b{color:var(--onP)}
.s-bold .hero .btn-p{background:var(--a);color:var(--onA);box-shadow:4px 4px 0 var(--ink);border:2px solid var(--ink)}
.s-bold .hero .btn-g{background:transparent;border-color:currentColor;color:var(--onP)}
.s-bold .hc-panel{background:var(--a);border:3px solid var(--ink);box-shadow:12px 12px 0 var(--ink);border-radius:0}
.s-bold .hc-panel::after{background:repeating-linear-gradient(45deg,transparent 0 18px,rgba(0,0,0,.08) 18px 20px);inset:0;width:auto;left:0;top:0;border-radius:0}
.s-bold .hc-icon{color:var(--ink)}
.s-bold .hc-feat{background:var(--card);color:var(--ink)}
.s-bold .hc-info{background:var(--a);color:var(--onA)}
.s-bold .hc-tile,.s-bold .svc,.s-bold .card,.s-bold .person,.s-bold .plan,.s-bold .rev,.s-bold .form,.s-bold .pay{border:2px solid var(--ink);border-radius:0;box-shadow:6px 6px 0 var(--ink)}
.s-bold .hstats{border-top-color:rgba(255,255,255,.25)}
.s-bold .hstat{border-left-color:rgba(255,255,255,.25)}
.s-bold .hstat b{color:var(--aOnP)}
.s-bold .hstat span{color:var(--onP);opacity:.8}
.s-bold .marq{background:var(--ink);color:var(--bg);border:0}
.s-bold .h2,.s-bold .cta-box h2{text-transform:uppercase}
.s-bold .grid{gap:26px}
.s-bold .btn{border-width:2px}
.s-bold .cta-box{border-radius:0;border:3px solid var(--ink);box-shadow:10px 10px 0 var(--ink)}
.s-bold .tag,.s-bold .badge{border-radius:0}
/* --- luxe --- */
.s-luxe .hero{padding-top:88px}
.s-luxe .hc{max-width:none;justify-self:stretch;aspect-ratio:21/9;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr));text-align:left}
.s-luxe .hc.solo{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.s-luxe .hc-panel{grid-column:1;grid-row:1/3;border-radius:var(--r)}
.s-luxe .hc.solo .hc-panel{grid-row:1}
.s-luxe .hc-tile{border-radius:var(--r)}
.s-luxe .hc-icon{width:min(24%,190px);right:12%}
.s-luxe .hero-in{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;gap:56px}
.s-luxe .hero h1{font-size:clamp(44px,6.6cqi,88px);max-width:13em;font-weight:500}
.s-luxe .hero h1 em{font-style:italic;color:inherit}
.s-luxe .lead{margin-left:auto;margin-right:auto}
.s-luxe .cta-row,.s-luxe .trust{justify-content:center}
.s-luxe .pill{background:transparent;box-shadow:none;border-color:var(--line2);letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.s-luxe .btn{text-transform:uppercase;letter-spacing:.14em;font-size:12.5px}
.s-luxe .sec-head{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
.s-luxe .kicker::after{content:"";width:22px;height:2px;background:currentColor}
.s-luxe .svc{background:transparent;border:0;border-top:1px solid var(--line2);border-radius:0;padding:30px 4px 0}

.cl .lt{text-align:right;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px}
.qty button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700}
.qty button:focus-visible{outline:2px solid var(--p)}
.qty span{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tot{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line);font-size:13.5px}
.tot div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.tot .g{color:var(--muted);font-size:12.5px}
.tot .big{font-size:20px;font-weight:800;padding-top:6px}
.hint2{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}
.inv-wrap{position:absolute;inset:0;z-index:50;background:rgba(12,16,22,.55);overflow:auto;padding:20px}
.inv-bar{max-width:720px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.inv-sheet{max-width:720px;margin:0 auto;background:#fff;color:#111;border-radius:12px;padding:36px 40px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);font-size:13.5px}
.inv-h{display:flex;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:2px solid #111}
.inv-h h2{font-size:22px;font-weight:800}
.inv-h p{color:#444;font-size:12.5px;line-height:1.5}
.inv-h .r{text-align:right}
.inv-h .doc{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pDeep)}
.inv-to{display:flex;justify-content:space-between;gap:20px;padding:16px 0;font-size:13px}
.inv-to small{display:block;color:#666;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;font-weight:700;margin-bottom:3px}
.inv-sheet table{width:100%;border-collapse:collapse;margin-top:6px}
.inv-sheet th{background:#F3F4F6;color:#333;font-size:11px;position:static}
.inv-sheet td{white-space:normal;max-width:none}
.inv-sum{display:flex;justify-content:space-between;gap:24px;margin-top:16px;align-items:flex-start}
.inv-sum dl{min-width:240px;display:flex;flex-direction:column;gap:5px;margin:0}
.inv-sum dl div{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
.inv-sum dl .big{font-size:18px;font-weight:800;border-top:2px solid #111;padding-top:8px;margin-top:4px}
.inv-sum dl .g{color:#666;font-size:12px}
.inv-qr{display:flex;gap:12px;align-items:center;font-size:12px;color:#444;max-width:300px}
.inv-qr .q{width:104px;flex:none}
.inv-qr svg{width:100%;height:auto;display:block}
.inv-words{margin-top:14px;font-size:12.5px;color:#333}
.inv-f{margin-top:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;font-size:12px;color:#555}
.inv-f .sig{border-top:1px solid #999;padding-top:6px;min-width:160px;text-align:center}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.vbars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.vbar i{display:block;width:100%;max-width:46px;border-radius:7px 7px 3px 3px;background:var(--p);opacity:.75;min-height:3px}
.vbar:last-child i{opacity:1}
.vbar small{font-size:11.5px;color:var(--muted)}
.vbar b{font-size:10.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rsum{display:flex;gap:18px;margin-bottom:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.rsum b{display:block;font-size:18px;color:var(--ink)}
.settings{max-width:680px;display:flex;flex-direction:column;gap:14px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media print{
  html,body,#app,.sw,.app,.main,.content{height:auto!important;overflow:visible!important;background:#fff!important}
  body *{visibility:hidden!important}
  .inv-sheet,.inv-sheet *{visibility:visible!important}
  .inv-wrap{position:static!important;background:none!important;padding:0!important}
  .inv-sheet{position:absolute!important;left:0;top:0;width:100%;max-width:none;box-shadow:none!important;border-radius:0;padding:10mm}
  .inv-bar{display:none!important}
}
@container (max-width: 860px){
  .pos,.rgrid{grid-template-columns:minmax(0,1fr)}
}
@container (max-width: 760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;gap:10px;padding:10px 12px;overflow-x:auto;overflow-y:hidden}
  .brand{padding:0 4px 0 0}
  .brand small,.snav em,.side-foot,.snav .sep{display:none}
  .brand b{white-space:nowrap;font-size:14px}
  .snav{flex-direction:row;gap:4px}
  .snav button{width:auto;padding:8px 11px;white-space:nowrap}
  .top{padding:12px 16px}
  .top-act{width:100%;margin-left:0}
  .search{flex:1;width:auto}
  .content{padding:14px 16px 32px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi b{font-size:21px}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .inv-wrap{padding:10px}
  .inv-sheet{padding:22px 18px}
  .inv-h,.inv-sum,.inv-to{flex-direction:column}
  .inv-h .r{text-align:left}
  .inv-sum dl{min-width:0;width:100%}
  .sgrid,.cf{grid-template-columns:minmax(0,1fr)}
  .plist{max-height:none}
}

const NAMES = ['Rahul Verma','Anita Desai','Vijay Kumar','Meena Pillai','Sanjay Gupta','Pooja Nair','Arjun Reddy','Fatima Khan','Rohit Sharma','Kavya Iyer'];
function genRows(m, ctx, all){
  const out = [];
  for (let i = 0; i < 4; i++) {
    out.push(m.fields.map((f, j) => {
      const k = f.k, nm = NAMES[(i + ctx.off) % NAMES.length];
      if (j === 0) {
        if (ctx.titles && ctx.titles[i]) return ctx.titles[i];
        if (/^(name|customer|guest|patient|member|lead|emp|student)$/.test(k)) return nm;
        if (k === 'no') return m.sg.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() + '-' + (1001 + i);
        if (k === 'reg') return ['MH 12 AB 4521','MH 14 CD 9087','KA 05 EF 3310','DL 3C GH 7702'][i];
        return m.sg + ' ' + String.fromCharCode(65 + i);
      }
      if (f.t === 'ref') { const rm = all.find(x => x.id === f.ref); return rm && rm.rows.length ? rm.rows[i % rm.rows.length][0] : ''; }
      if (f.t === 'sel' || f.t === 'status') return f.o[i % f.o.length];
      if (f.t === 'money') return /salary/.test(k) ? [18000,24000,32000,15000][i] : [499,1250,2400,899][i];
      if (f.t === 'num') return [12,4,30,8][i];
      if (f.t === 'date') return '@' + [0,-1,2,-5][i];
      if (f.t === 'time') return ['10:00','11:30','15:00','17:30'][i];
      if (f.t === 'phone') return '98' + String(220 + i * 37 + ctx.off) + ' ' + String(41000 + i * 1371 + ctx.off * 7).slice(0,5);
      if (f.t === 'email') return nm.toLowerCase().replace(/[^a-z]+/g, '.') + '@example.com';
      if (/^(service|task|reason|title)$/.test(k) && ctx.services.length) return ctx.services[i % ctx.services.length];
      if (k === 'items') return ctx.products.length ? ctx.products[i % ctx.products.length] + ' ×' + (i + 1) : (i + 2) + ' items';
      if (/^(customer|owner|assigned|staff|agent|guardian|person|member|guest|patient|lead|emp|student|teacher|doctor|buyer)$/.test(k)) return NAMES[(i + ctx.off + 3 + j) % NAMES.length];
      if (/^(city|loc)$/.test(k)) return ctx.city || 'Pune';
      if (/^(sku|batch|rack|shelf|mid|eid|roll|gst|room|sec)$/.test(k)) return k.toUpperCase().slice(0, 2) + '-' + (101 + i);
      if (k === 'model') return ['Maruti Swift','Hyundai Creta','Tata Nexon','Honda City'][i];
      if (k === 'perks') return ['Basic access','Full access','Full access, extras','Everything included'][i];
      return '';
    }));
  }

}
function autoStats(mods){
  const st = [], m0 = mods[0];
  st.push([m0.name, m0.id, 'count', [], m0.icon]);
  for (const m of mods) { const sf = m.fields.find(f => f.t === 'status'); const o = sf && sf.o.find(x => /^(open|pending|due|scheduled|booked|in progress|new|to do|issued)$/i.test(x)); if (o) { st.push([o + ' ' + m.name.toLowerCase(), m.id, 'count', [{k:sf.k, op:'eq', v:o}], 'clock']); break; } }
  for (const m of mods) { const df = m.fields.find(f => f.t === 'date' && /^(date|checkin|issued)$/.test(f.k)); if (df) { st.push([m.name + ' today', m.id, 'count', [{k:df.k, op:'today'}], 'calendar']); break; } }
  for (const m of mods) { const mf = m.fields.find(f => f.t === 'money' && /amount|total|paid|fee/.test(f.k)) || m.fields.find(f => f.t === 'money'), sf = m.fields.find(f => f.t === 'status' && (f.o || []).includes('Paid')); if (mf && sf) { st.push(['Collected', m.id, 'sum:' + mf.k, [{k:sf.k, op:'eq', v:'Paid'}], 'wallet']); break; } }
  for (const m of mods.slice(1)) { if (st.length >= 4) break; if (!st.some(s => s[1] === m.id)) st.push([m.name, m.id, 'count', [], m.icon]); }
  return st.slice(0, 4);
}
function autoAlerts(mods){

    });

  });

}

  if (m) return m[1].trim();
  m = raw.match(/\b(?:called|named|name is|name will be|brand name is|business name is|brand is|company is)\s+([A-Za-z0-9&@.'’-]+(?:\s+(?!(?:in|at|from|with|for|and|that|which|based|located|near|it|is|we|to|of|on|a|an|the)\b)[A-Za-z0-9&@.'’-]+){0,3})/i);
  if (m) { const n = m[1].replace(/[.,]$/, '').trim(); return /[A-Z]/.test(n) ? n : titleCase(n); }
  return '';
}
function extractCity(raw, low){
  for (const c of CITIES) if (phraseRx(c).test(low)) return titleCase(c === 'bangalore' ? 'bengaluru' : c === 'gurgaon' ? 'gurugram' : c === 'cochin' ? 'kochi' : c);
  const m = raw.match(/\b(?:in|at|from|based in|located in)\s+([A-Z][a-zA-Z]{2,}(?:\s[A-Z][a-zA-Z]{2,})?)/);
  if (m && !COLOR_WORDS[m[1].toLowerCase()] && !/^(India|English|Hindi|My|Our|The|A|An)$/.test(m[1])) return m[1];
  return '';
}
function extractNoun(low){
  const STOP = '(?=\\s+(?:called|named|in|at|with|that|which|where|based|located|near|to|and|website|site|software|system|app|management)\\b|\\s*[.,!;]|\\s*$)';
  const m = low.match(new RegExp("\\bfor\\s+(?:(?:my|an|a|our|the|his|her|their)\\s+)?([a-z&'-]+(?:\\s+[a-z&'-]+){0,3}?)" + STOP));
  let n = m ? m[1].trim() : '';
  if (!n) { const m2 = low.match(/\b(?:an|a|my|our)\s+([a-z&'-]+(?:\s+[a-z&'-]+){0,2}?)\s+(?:website|site|app|software|system|management)\b/); n = m2 ? m2[1].trim() : ''; }
  n = n.replace(/\b(small|new|local|own|online|simple|nice|good|best|perfect|beautiful|modern|website|site|management|software|system|app|business|company|firm)\b/g, '').replace(/\s+/g, ' ').trim();
  return n;
}
function subjectOf(n){ return n.replace(/\b(shop|store|business|company|brand|startup|centre|center|services|service|agency|outlet|firm|place)\b/g, '').replace(/\s+/g, ' ').trim() || n; }
function archFromWords(low){
  if (/\b(shop|store|brand|sell|selling|boutique|mart|products?)\b/.test(low)) return 'store';
  if (/\b(clinic|care|therapy|therapist|health|doctor|hospital|treatment)\b/.test(low)) return 'care';
  if (/\b(class|classes|course|courses|academy|training|tuition|coaching|school|teach|lessons?)\b/.test(low)) return 'learn';
  if (/\b(food|kitchen|cafe|café|restaurant|snacks|meals|dhaba|bakery|juice)\b/.test(low)) return 'food';
  if (/\b(stay|resort|rooms|lodge|camp|camping|hostel)\b/.test(low)) return 'stay';
  if (/\b(fitness|gym|sports|training centre|martial|boxing|swimming)\b/.test(low)) return 'fitness';
  if (/\b(studio|design|photo|art|portfolio|freelance)\b/.test(low)) return 'portfolio';
  return 'service';
}

function understand(raw, forceKind){

      const hue = k ? k.h : hashStr(noun) % 360;
      const nm = name || (city ? city : PREFIX[hashStr(noun) % PREFIX.length]) + ' ' + (k ? NAME_SUFFIX[k.k] || titleCase(subj) : titleCase(subj));
      spec = composeWebsite({name:nm, city, label, noun:subj, arch, icon:k ? k.i : ARCH_ICON[arch], svc:k && k.svc, sh:k && k.sh, style:k ? k.st : null, font:k ? k.fo : null, p:hsl2hex(hue, 58, 30), a:accentFor(hsl2hex(hue, 58, 30))});

  } else {

    });
    if (listM) {
      listM[1].split(/,|\band\b|&|\//).map(x => x.replace(/\s+(?:in|at|near|from|for)\s+.*$/, '').replace(/\b(a|an|the|my|our|their|all|its|proper|simple|full|complete|separate|module|modules|section|sections|page|pages|tab|tabs|management|tracking|details|list|lists)\b/g, '').replace(/\s+/g, ' ').trim())

    }
    if (added.length) { notes.push(['Added because you asked', added.join(', ')]); if (!spec.tpl) { spec.stats = autoStats(spec.modules); spec.alerts = autoAlerts(spec.modules); } }
    if (name) spec.name = name;
    if (city && !name && spec.tpl && !kb) spec.name = spec.name;
    if (/\b(login|password|secure|lock|admin login)\b/.test(low)) { spec.login.on = true; notes.push(['Lock', 'Password screen on (admin / admin123)']); }

function runCmd(text){

    h += grp('Billing', 'Billing counter', s.billing ? tog('“New bill” screen with GST bills', 'billing.on') + '<p class="note">Sells from <b>' + esc((s.modules.find(m => m.id === s.billing.items) || {}).name || '') + '</b>, saves bills in <b>' + esc((s.modules.find(m => m.id === s.billing.to) || {}).name || '') + '</b>' + (s.billing.stock ? ' and reduces stock automatically' : '') + '. Bills print as PDF and go out on WhatsApp with a UPI QR code.</p>' : '<p class="note">This software has no counter billing yet.</p><button class="b b-ghost b-sm" type="button" data-hint="Add GST billing">' + ico('receipt') + 'Add a billing counter</button>');
    h += grp('Look', 'Colours', colours('Main colour', 'p', SWATCHES) + colours('Highlight colour', 'a', ACCENTS));
    h += grp('Settings', 'Settings', '<label class="f" for="k-currency">Currency<select class="in" id="k-currency" data-k="currency">' + [['₹','₹ Rupee'],['$','$ Dollar'],['€','€ Euro'],['£','£ Pound'],['AED ','AED Dirham'],['৳','৳ Taka'],['Rs ','Rs (Nepal, Sri Lanka, Pakistan)']].map(c => '<option value="' + esc(c[0]) + '"' + (s.currency === c[0] ? ' selected' : '') + '>' + esc(c[1]) + '</option>').join('') + '</select></label>' +
      tog('Start with sample records', 'sample') + togOff('Password screen', 'login.on') + (s.login.on ? '<div class="row2">' + fld('Username', 'login.user') + fld('Password', 'login.pass') + '</div><p class="note">A simple lock for a shared counter computer. It is not bank-grade security, since the file runs in the browser.</p>' : ''));
  }
  p.innerHTML = h; p.scrollTop = top;
}

/* ---------- files: export and Banao itself ---------- */
function fileName(s){ return slugify(s.name) + (s.kind === 'software' ? '-' + slugify(s.title) : '') + '.html'; }
function selfHTML(){
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Banao App Builder</title>\n' +
    (SELF.fonts ? '<link rel="stylesheet" id="banao-fonts" href="' + esc(SELF.fonts) + '">\n' : '') +
    '<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>\n<style id="banao-css">' + SELF.css + '</style>\n</head>\n<body>\n' + SELF.bar +
    '\n<main id="view"></main>\n<div id="modal" hidden></div>\n<div class="toast" id="toast" role="status" aria-live="polite"></div>\n<scr' + 'ipt>' + SELF.js + '</scr' + 'ipt>\n</body>\n</html>\n';
}
function showFile(o){
  const kb = Math.max(1, Math.round(new Blob([o.html]).size / 1024)), m = $('#modal');
  m.innerHTML = '<div class="m-scrim" data-act="close-modal"></div><div class="m-box" role="dialog" aria-modal="true" aria-labelledby="m-title"><div class="m-head"><h2 id="m-title">' + esc(o.title) + '</h2><button class="mini" type="button" data-act="close-modal" aria-label="Close">' + ico('x') + '</button></div>' +
    '<div class="file"><span class="fi">HTML</span><div><b>' + esc(o.name) + '</b><span>' + kb + ' KB · one file · no API key · works offline</span></div></div>' +
    '<div class="m-act"><button class="b b-acc" type="button" data-act="download" id="dlbtn">' + ico('download') + 'Download file</button><button class="b b-ghost" type="button" data-act="copy">' + ico('copy') + 'Copy code</button></div><p class="m-msg" id="m-msg" role="status"></p>' +
    '<ol class="steps">' + o.steps.map(x => '<li><span>' + x + '</span></li>').join('') + '</ol><details class="codebox"><summary>View the code</summary><textarea class="code" id="code" readonly aria-label="File code">' + esc(o.html) + '</textarea></details></div>';
  m.hidden = false; STATE.exportHTML = o.html; STATE.exportName = o.name;
  setTimeout(() => { const b = $('#dlbtn'); if (b) b.focus(); }, 30);
}
function openExport(spec){
  const s = spec || STATE.cur.spec;
  showFile({title:'Your file is ready', name:fileName(s), html:exportHTML(s), steps:s.kind === 'website'
    ? ['Open the file in Chrome, Edge or Safari to check it. It works on phones too.', 'To put it online for free, rename it to <b>index.html</b> and drag it onto <a href="https://app.netlify.com/drop" target="_blank" rel="noopener">Netlify Drop</a>. You get a public link in about a minute. GitHub Pages works too.', 'Orders and enquiries arrive on WhatsApp at ' + esc(s.phone || 'your number') + '. To change anything later, open the project from Saved, edit, and download again.']
    : ['Open the file in Chrome or Edge on your counter computer or phone. It works without internet.', (s.billing ? 'Make bills from <b>New bill</b>, print them or save as PDF, and send them on WhatsApp. ' : '') + 'Fill in GSTIN and UPI ID under <b>Settings</b> so they print on bills.', 'Records stay in that browser. Use <b>Settings › Download backup</b> every week, and <b>Restore backup</b> to move to another computer. Import your old Excel lists from any module.']});
}
function openSelf(){
  if (!SELF.js) { toast('This copy of Banao cannot package itself. Open it from the original link.'); return; }
  showFile({title:'Banao for your computer', name:'banao.html', html:selfHTML(), steps:['Save the file anywhere, for example on your desktop, and open it in Chrome, Edge or Safari.', 'Everything works offline with no account and no API key: build, edit and download websites and software.', 'Saved projects stay in the browser you use it in. Download your projects as files to keep copies.']});
}
function closeModal(){ const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
async function doDownload(){
  const msg = $('#m-msg');
  if (NATIVE) { try { const where = await nativeSave(STATE.exportName, STATE.exportHTML); msg.textContent = where ? 'Saved in ' + where + '. You can also send it from the share menu.' : 'Choose where to keep or send ' + STATE.exportName + '.'; } catch (e) { msg.textContent = 'This phone could not save the file. Use Copy code instead.'; } return; }
  const d = await DL;
  if (!d) {
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([STATE.exportHTML], {type:'text/html'})); a.download = STATE.exportName; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); msg.textContent = 'Downloading ' + STATE.exportName + '. If nothing appears, use Copy code.'; }
    catch (e) { msg.textContent = 'Downloads are not available here. Use Copy code instead.'; }
    return;
  }
  try { const r = await d.save({filename:STATE.exportName, data:STATE.exportHTML}); msg.textContent = r && r.status === 'delivered' ? 'Sent.' : 'Saved ' + STATE.exportName + '. Open it from your downloads.'; }
  catch (e) { const c = e && e.code; msg.textContent = c === 'declined' ? 'Download cancelled. Nothing was saved.' : c === 'rate_limited' ? 'A download prompt is already open. Finish that one first.' : 'This view cannot save files. Use Copy code instead.'; }
}
async function doCopy(){
  const msg = $('#m-msg');
  try { await navigator.clipboard.writeText(STATE.exportHTML); msg.textContent = 'Code copied. Paste it into a text file and save it as ' + STATE.exportName + '.'; }
  catch (e) { const box = $('.codebox'); box.open = true; const t = $('#code'); t.focus(); t.select(); msg.textContent = 'Copying was blocked here. The code is selected below: press Ctrl+C, or long-press and choose Copy.'; }
}

/* ---------- navigation ---------- */
function go(v){
  if (v === 'back') v = STATE.prev && STATE.prev !== 'editor' && STATE.prev !== 'build' ? STATE.prev : 'home';
  if (STATE.view !== 'editor' && STATE.view !== 'build') STATE.prev = STATE.view;
  if (v !== 'build') { clearInterval(buildT); if (STATE.view === 'build' && v !== 'editor') STATE.build = null; }
  if (v !== 'editor') { if (ro) { ro.disconnect(); ro = null; } if (io) { io.disconnect(); io = null; } shadow = null; }
  if (thumbIO) { thumbIO.disconnect(); thumbIO = null; }
  STATE.view = v; STATE.confirmDel = null;
  ['home','projects'].forEach(t => { const b = $('#tab-' + t); const on = t === v || (t === 'home' && (v === 'build' || v === 'editor')); b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (v === 'home') renderHome(); else if (v === 'build') renderBuild(); else if (v === 'projects') renderProjects(); else if (v === 'editor') renderEditor();
  window.scrollTo(0, 0);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-open],[data-act],[data-dev],[data-pick],[data-color],[data-add],[data-rm],[data-filter],[data-ex],[data-proj],[data-projdel],[data-projdl],[data-rmmod],[data-kind],[data-name],[data-rmphoto],[data-rmgal],[data-hint]');
  if (!t) return;
  if (t.hasAttribute('data-nav')) { go(t.dataset.nav); return; }
  if (t.hasAttribute('data-kind')) { STATE.kindPick = t.dataset.kind; document.querySelectorAll('[data-kind]').forEach(b => { b.classList.toggle('on', b === t); b.setAttribute('aria-pressed', b === t); }); return; }
  if (t.hasAttribute('data-filter')) { STATE.filter = t.dataset.filter; document.querySelectorAll('[data-filter]').forEach(b => { b.classList.toggle('on', b === t); b.setAttribute('aria-pressed', b === t); }); renderCards(); return; }
  if (t.hasAttribute('data-open')) { const [k, id] = t.dataset.open.split(':'); const tpl = (k === 'web' ? WEB_TEMPLATES : SOFT_TEMPLATES).find(x => x.id === id); openSpec(k === 'web' ? webFromTemplate(tpl) : softFromTemplate(tpl)); return; }
  if (t.hasAttribute('data-ex')) { const p = $('#prompt'); p.value = t.dataset.ex; STATE.prompt = p.value; p.focus(); return; }
  if (t.hasAttribute('data-proj')) { const p = projects.find(x => x.id === t.dataset.proj); if (p) { STATE.cur = clone(p); STATE.cmdMsg = null; STATE.open = new Set(['Business', p.spec.kind === 'website' ? 'Hero' : 'Modules']); go('editor'); } return; }
  if (t.hasAttribute('data-projdl')) { const p = projects.find(x => x.id === t.dataset.projdl); if (p) openExport(p.spec); return; }
  if (t.hasAttribute('data-projdel')) { const id = t.dataset.projdel; if (STATE.confirmDel === id) { projects = projects.filter(x => x.id !== id); persist(); updateCount(); STATE.confirmDel = null; toast('Project deleted'); } else STATE.confirmDel = id; renderProjects(); return; }
  if (t.hasAttribute('data-dev')) { STATE.device = t.dataset.dev; document.querySelectorAll('[data-dev]').forEach(b => { b.classList.toggle('on', b === t); b.setAttribute('aria-pressed', b === t); }); $('#frame').className = 'pv-frame ' + STATE.device; fitPreview(); return; }
  if (t.hasAttribute('data-hint')) { runCmd(t.dataset.hint); return; }
  const s = STATE.cur && STATE.cur.spec;
  if (t.hasAttribute('data-name')) { s.name = t.dataset.name; $('#ed-name').textContent = s.name; renderPanel(); updatePreview(); saveSoon(); return; }
  if (t.hasAttribute('data-pick')) { s[t.dataset.pick] = t.dataset.v; if (t.dataset.pick === 'style') s.font = STYLE_FONT[t.dataset.v] || s.font; renderPanel(); updatePreview(); saveSoon(); return; }
  if (t.hasAttribute('data-color')) { s[t.dataset.color] = t.dataset.v; renderPanel(); updatePreview(); saveSoon(); return; }
  if (t.hasAttribute('data-add')) {
    const path = t.dataset.add; let arr = getPath(s, path); if (!arr) { setPath(s, path, []); arr = getPath(s, path); }
    const blank = path === 'about.points' ? 'New highlight' : path === 'stats' ? {v:'100+', l:'New number'} : path === 'reviews' ? {q:'', n:'', r:''} : path === 'faq' ? {q:'New question?', a:''} : path === 'services.items' ? {t:'New service', d:'', i:s.icon} : {t:'New item', m:'', p:'', tag:''};
    arr.push(blank); renderPanel(); updatePreview(); saveSoon(); return;
  }
  if (t.hasAttribute('data-rm')) { getPath(s, t.dataset.rm).splice(+t.dataset.i, 1); renderPanel(); updatePreview(); saveSoon(); return; }
  if (t.hasAttribute('data-rmphoto')) { delete getPath(s, t.dataset.rmphoto).img; renderPanel(); updatePreview(); saveSoon(); return; }
  if (t.hasAttribute('data-rmgal')) { s.gallery.splice(+t.dataset.rmgal, 1); renderPanel(); updatePreview(); saveSoon(); return; }
  if (t.hasAttribute('data-rmmod')) { if (s.modules.length <= 1) { toast('Keep at least one module'); return; } const gone = s.modules.splice(+t.dataset.rmmod, 1)[0]; if (!s.modules.some(m => m.on !== false)) s.modules[0].on = true; if (s.billing && (s.billing.items === gone.id || s.billing.to === gone.id)) s.billing = null; renderPanel(); updatePreview(); saveSoon(); return; }
  const act = t.dataset.act;
  if (act === 'build') {
    const p = $('#prompt'), txt = p.value.trim(), err = $('#perr');
    if (txt.length < 4) { err.hidden = false; err.textContent = 'Describe your business first, for example “billing software for my bakery in Pune”.'; p.focus(); return; }
    err.hidden = true; startBuild(txt);
  }
  else if (act === 'openbuild') finishBuild();
  else if (act === 'undocmd') undoCmd();
  else if (act === 'morenames') { STATE.nameSeed++; s.nameIdeas = suggestNames(s.label, s.city || '', STATE.nameSeed, s.name); renderPanel(); }
  else if (act === 'export') openExport();
  else if (act === 'getapp') openSelf();
  else if (act === 'close-modal') closeModal();
  else if (act === 'download') doDownload();
  else if (act === 'copy') doCopy();
  else if (act === 'rmimg') { s.image = ''; renderPanel(); updatePreview(); saveSoon(); }
  else if (act === 'jump') $('#stage').scrollIntoView({behavior:'smooth', block:'start'});
  else if (act === 'addmod') {
    const inp = $('#newmod'), raw = inp.value.trim();
    if (!raw) { inp.focus(); return; }
    const parts = raw.split(':'), name = parts[0].trim(), cols = (parts[1] || '').split(/,|\band\b|&/i).map(x => x.trim()).filter(Boolean);
    const g = cols.length ? customModule(name, cols, s.modules) : genericModule(name);
    if (s.modules.some(m => m.id === g.id)) { toast('A module with that name already exists'); return; }
    if (!cols.length) g.rows = genRows(g, {titles:[], off:3, city:'', services:[], products:[]}, s.modules);
    s.modules.push(g); PV_MEM.delete('mistri:' + s.slug);
    STATE.open.add('Modules'); renderPanel(); updatePreview(); saveSoon(); toast('Added ' + g.name);
  }
});
document.addEventListener('submit', e => {
  if (!e.target.hasAttribute('data-cmd')) return;
  e.preventDefault();
  const inp = $('#cmdin'), v = (inp.value || '').trim(); if (v.length < 2) { inp.focus(); return; }
  runCmd(v);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { STATE.q = t.value; renderCards(); return; }
  if (t.id === 'prompt') { STATE.prompt = t.value; return; }
  const k = t.dataset && t.dataset.k; if (!k || !STATE.cur) return;
  const s = STATE.cur.spec;
  if (t.type === 'checkbox') return;
  setPath(s, k, t.type === 'number' ? (t.value === '' ? '' : Number(t.value)) : t.value);
  if (/^modules\.\d+\.name$/.test(k)) { const m = s.modules[+k.split('.')[1]]; m.sg = singular(t.value) || m.sg; }
  if (k === 'name') { const n = $('#ed-name'); if (n) n.textContent = t.value || 'Untitled'; }
  if (t.type === 'color') document.querySelectorAll('[data-color="' + k + '"]').forEach(b => b.classList.remove('on'));
  previewSoon(); saveSoon();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!STATE.cur) return;
  const s = STATE.cur.spec;
  if (t.id === 'imgfile' && t.files && t.files[0]) { loadImage(t.files[0], 1600).then(d => { s.image = d; renderPanel(); updatePreview(); saveSoon(); toast('Photo added'); }).catch(() => toast('That file could not be read as an image')); return; }
  if (t.id === 'galfile' && t.files && t.files.length) { Promise.all(Array.from(t.files).slice(0, 8).map(f => loadImage(f, 1400).catch(() => null))).then(list => { s.gallery = (s.gallery || []).concat(list.filter(Boolean)).slice(0, 12); renderPanel(); updatePreview(); saveSoon(); toast('Photos added'); }); return; }
  if (t.dataset && t.dataset.photo && t.files && t.files[0]) { const path = t.dataset.photo; loadImage(t.files[0], 900).then(d => { getPath(s, path).img = d; renderPanel(); updatePreview(); saveSoon(); toast('Photo added'); }).catch(() => toast('That file could not be read as an image')); return; }
  const k = t.dataset && t.dataset.k; if (!k || t.type !== 'checkbox') return;
  if (/^modules\.\d+\.on$/.test(k) && !t.checked && s.modules.filter(m => m.on !== false).length <= 1) { t.checked = true; toast('Keep at least one module'); return; }
  setPath(s, k, t.checked);
  if (k === 'show.cart' && t.checked && !/bag/i.test(s.show.btn || '')) s.show.btn = 'Add to bag';
  if (k === 'sample') PV_MEM.delete('mistri:' + s.slug);
  if (k === 'login.on' || k === 'sample' || k === 'show.cart') renderPanel();
  updatePreview(); saveSoon();
});
document.addEventListener('toggle', e => { const d = e.target; if (d.classList && d.classList.contains('grp')) { const g = d.dataset.g; if (d.open) STATE.open.add(g); else STATE.open.delete(g); } }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  if (e.key === 'Enter' && e.target.id === 'newmod') { e.preventDefault(); const b = document.querySelector('[data-act="addmod"]'); if (b) b.click(); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'prompt' && window.innerWidth > 700) { e.preventDefault(); const b = document.querySelector('[data-act="build"]'); if (b) b.click(); }
});
window.addEventListener('resize', () => { fitPreview(); scaleThumbs(); });

/* a link like /app/?q=bakery+billing+software opens Banao with that request and builds it */
let START_Q = '';
try { START_Q = (new URLSearchParams(location.search).get('q') || '').trim().slice(0, 500); if (START_Q) history.replaceState(null, '', location.pathname); } catch (e) {}
updateCount();
if (START_Q) { STATE.prompt = START_Q; go('home'); startBuild(START_Q); } else go('home');
</script>
