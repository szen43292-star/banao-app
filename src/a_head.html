<title>Banao App Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="banao-fonts" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Archivo+Black&family=Archivo:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&family=Nunito:wght@400;600;800&family=Sora:wght@400;600;700&display=swap">
<style id="banao-css">
/* Layout: a workbench. A centred brief card on a quiet dotted ground, ready designs below as real miniature screens, and a two-pane bench for editing with the live screen on the right. */
:root{
  --ground:#F2F3F7; --sheet:#FFFFFF; --sunk:#F6F7FA; --ink:#14162B; --ink-2:#33385A; --muted:#5E6483; --line:#E1E4EC; --line-2:#C9CEDC;
  --brick:#F2A900; --on-brick:#231A00; --brick-ink:#8A5D00; --brick-soft:#FFF2CC;
  --k-web:#3D41B5; --k-soft:#8A5D00; --ok:#137A47; --danger:#B42318;
  --dot:rgba(20,22,43,.09); --glow:rgba(242,169,0,.16); --ring:rgba(242,169,0,.34); --scrim:rgba(8,10,22,.5);
  --shadow:0 1px 2px rgba(20,22,43,.05),0 14px 34px -16px rgba(20,22,43,.22);
  --shadow-lg:0 2px 4px rgba(20,22,43,.04),0 30px 60px -28px rgba(20,22,43,.32);
  --f-disp:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D0F1C; --sheet:#161A2E; --sunk:#111427; --ink:#ECEEF8; --ink-2:#C7CBE3; --muted:#969CBA; --line:#262B47; --line-2:#39405F;
    --brick:#F6B51E; --on-brick:#1A1300; --brick-ink:#F6C251; --brick-soft:#33280A;
    --k-web:#A3A6FF; --k-soft:#F6C251; --ok:#4ADE80; --danger:#FF8A80;
    --dot:rgba(236,238,248,.07); --glow:rgba(246,181,30,.10); --ring:rgba(246,181,30,.38); --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 36px -16px rgba(0,0,0,.7); --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 30px 60px -26px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D0F1C; --sheet:#161A2E; --sunk:#111427; --ink:#ECEEF8; --ink-2:#C7CBE3; --muted:#969CBA; --line:#262B47; --line-2:#39405F;
  --brick:#F6B51E; --on-brick:#1A1300; --brick-ink:#F6C251; --brick-soft:#33280A;
  --k-web:#A3A6FF; --k-soft:#F6C251; --ok:#4ADE80; --danger:#FF8A80;
  --dot:rgba(236,238,248,.07); --glow:rgba(246,181,30,.10); --ring:rgba(246,181,30,.38); --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 36px -16px rgba(0,0,0,.7); --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 30px 60px -26px rgba(0,0,0,.8); color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ground)}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,h4,p{margin:0}
.ic{width:18px;height:18px;flex:none}
.mono{font-family:var(--f-mono)}
.small{font-size:12.5px;color:var(--muted)}
.page{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;height:64px}
.logo{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:23px;letter-spacing:-.03em}
.logo:focus-visible{outline:3px solid var(--brick);outline-offset:4px;border-radius:8px}
.logo svg{width:32px;height:32px;flex:none}
.logo small{font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:0;color:var(--muted);padding:3px 8px;border:1px solid var(--line-2);border-radius:99px;margin-left:2px}
.tabs{display:flex;gap:2px;margin-left:auto;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--ground)}
.tabs button:focus-visible{outline:3px solid var(--brick)}
.tabs em{font-style:normal;font-family:var(--f-mono);font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--brick);color:var(--on-brick);display:inline-grid;place-items:center}
.tabs em:empty{display:none}

/* buttons */
.b{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:11px;font-weight:700;font-size:14.5px;white-space:nowrap;transition:transform .12s ease,filter .12s ease,background .12s,border-color .12s}
.b:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
.b-acc{background:var(--brick);color:var(--on-brick);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.b-acc:hover{filter:brightness(1.05);transform:translateY(-1px)}
.b-ink{background:var(--ink);color:var(--ground)}
.b-ink:hover{transform:translateY(-1px)}
.b-ghost{border:1px solid var(--line-2);background:var(--sheet);color:var(--ink)}
.b-ghost:hover{border-color:var(--ink-2)}
.b[disabled]{opacity:.55;cursor:default;transform:none}
.b-lg{min-height:50px;padding:0 22px;font-size:16px;border-radius:13px}
.b-danger{background:var(--danger);color:#fff}
.b-sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}

/* home */
.hero{position:relative;isolation:isolate;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse 70% 80% at 50% 30%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse 70% 80% at 50% 30%,#000 30%,transparent 75%)}
.hero::after{content:"";position:absolute;left:50%;top:-180px;width:900px;height:520px;transform:translateX(-50%);z-index:-1;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.hero-in{max-width:860px;margin:0 auto;padding-block:58px 40px;text-align:center;display:flex;flex-direction:column;align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:99px;background:var(--sheet);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);box-shadow:var(--shadow)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.hd{font-family:var(--f-disp);font-weight:800;font-size:clamp(36px,6.4vw,74px);line-height:.98;letter-spacing:-.04em;margin-top:22px;text-wrap:balance}
.hd .hl{position:relative;white-space:nowrap;color:var(--ink)}
.hd .hl::after{content:"";position:absolute;left:-2%;right:-2%;bottom:-.08em;height:.32em;z-index:-1;background:var(--brick);border-radius:4px;transform:skewX(-8deg) rotate(-1deg);opacity:.92}
.sub{font-size:clamp(16px,1.6vw,18.5px);color:var(--muted);max-width:36em;margin-top:20px;line-height:1.6;text-wrap:pretty}
.composer{width:100%;margin-top:32px;background:var(--sheet);border:1.5px solid var(--line-2);border-radius:22px;box-shadow:var(--shadow-lg);text-align:left;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--brick);box-shadow:0 0 0 5px var(--ring),var(--shadow-lg)}
.prompt{display:block;width:100%;min-height:118px;font:inherit;font-size:18.5px;line-height:1.5;padding:20px 22px 8px;border:0;background:transparent;color:var(--ink);resize:vertical;border-radius:22px 22px 0 0}
.prompt:focus{outline:none}
.prompt::placeholder{color:var(--muted)}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 12px 14px;flex-wrap:wrap}
.c-note{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.c-note .ic{width:16px;height:16px;color:var(--ok)}
.err-line{color:var(--danger);font-size:14px;margin-top:12px;font-weight:600}
.ex{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px;max-width:800px}
.ex-l{font-size:13px;color:var(--muted);font-weight:600;align-self:center;margin-right:2px}
.exb{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 9px;border-radius:99px;background:var(--sheet);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-2);transition:border-color .12s,transform .12s}
.exb .ic{width:16px;height:16px;color:var(--brick-ink)}
.exb:hover{border-color:var(--line-2);color:var(--ink);transform:translateY(-1px)}
.exb:focus-visible{outline:3px solid var(--brick)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button .ic{width:16px;height:16px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.seg button:focus-visible{outline:3px solid var(--brick)}
.seg em{font-style:normal;font-family:var(--f-mono);font-size:11px;opacity:.7}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0 0;padding:0;list-style:none}
.how li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:16px 18px;background:var(--sheet);border:1px solid var(--line);border-radius:16px}
.how b{display:block;font-size:15px}
.how span{font-size:13.5px;color:var(--muted);line-height:1.45}
.how .n{width:30px;height:30px;border-radius:9px;background:var(--brick-soft);color:var(--brick-ink);font-family:var(--f-mono);font-weight:600;font-size:13px;display:grid;place-items:center;flex:none}
.gal-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin:52px 0 18px}
.gal-head h2{font-family:var(--f-disp);font-weight:800;font-size:clamp(26px,3.2vw,36px);letter-spacing:-.03em;line-height:1.05}
.gal-head p{color:var(--muted);margin-top:6px;font-size:14.5px}
.gal-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.find{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--sheet);width:min(280px,100%);color:var(--muted)}
.find:focus-within{border-color:var(--brick);box-shadow:0 0 0 3px var(--ring)}
.find input{all:unset;flex:1;min-width:0;color:var(--ink);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;padding-bottom:64px}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:12px;border-radius:18px;padding:10px 10px 14px;background:var(--sheet);border:1px solid var(--line);transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line-2)}
.tcard:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
.tmeta{padding:0 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tmeta h3{font-size:16px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tmeta h3 .ic{width:16px;height:16px;color:var(--muted);transition:transform .15s,color .15s}
.tcard:hover .tmeta h3 .ic{transform:translateX(3px);color:var(--ink)}
.tmeta p{font-size:13.5px;color:var(--muted);line-height:1.45}
.kind{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.kind::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}
.k-web{color:var(--k-web)}.k-soft{color:var(--k-soft)}

/* live miniature screens */
.lt{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:11px;background:var(--sunk);border:1px solid var(--line);isolation:isolate}
.lt::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--sheet) 70%,transparent) 50%,transparent 70%) 0 0/220% 100%;animation:sheen 1.4s linear infinite;z-index:2}
.lt.on::after{display:none}
.lt-stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform:scale(var(--lts,.21));transform-origin:0 0;pointer-events:none;background:#fff}
@keyframes sheen{to{background-position:-220% 0}}

/* build screen */
.build{padding-block:56px 80px;display:flex;justify-content:center}
.bcard{width:min(680px,100%);background:var(--sheet);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:28px}
.bcard .hd{font-size:clamp(30px,4.4vw,46px);margin-top:10px;text-align:left}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--brick);flex:none}
.bquote{margin-top:14px;font-size:16px;color:var(--ink-2);background:var(--sunk);border-radius:12px;padding:12px 14px;overflow-wrap:anywhere}
.bsteps{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column}
.bsteps li{display:grid;grid-template-columns:26px 110px minmax(0,1fr);gap:12px;align-items:start;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14.5px;color:var(--muted);opacity:.45;transition:opacity .2s}
.bsteps li:last-child{border-bottom:0}
.bsteps li b{font-weight:600;color:var(--muted)}
.bsteps li span{overflow-wrap:anywhere}
.bsteps .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center}
.bsteps li.done{opacity:1;color:var(--ink)}
.bsteps li.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.bsteps li.done .st .ic{width:13px;height:13px}
.bsteps li.now{opacity:1}
.bsteps li.now .st{border-color:var(--brick);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.b-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center;justify-content:space-between}

/* editor */
.ed-bar{display:flex;align-items:center;gap:12px;padding-block:14px}
.ed-title{display:flex;flex-direction:column;min-width:0;flex:1}
.ed-title b{font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.ed-body{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start;padding-bottom:28px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:18px;overflow:auto;max-height:calc(100vh - 160px);position:sticky;top:80px;overscroll-behavior:contain}
.stage{min-width:0;position:sticky;top:80px}
.cmd{display:flex;gap:8px;align-items:center;background:var(--sheet);border:1.5px solid var(--line-2);border-radius:15px;padding:6px 6px 6px 14px}
.cmd:focus-within{border-color:var(--brick);box-shadow:0 0 0 4px var(--ring)}
.cmd>.ic{color:var(--brick-ink)}
.cmd input{all:unset;flex:1;min-width:0;font-size:15px;color:var(--ink);padding:8px 0}
.cmd input::placeholder{color:var(--muted)}
.cmd-hints{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.cmd-hints::after{content:"";flex:0 0 36px}
.cmd-hints::-webkit-scrollbar{display:none}
.hint{all:unset;box-sizing:border-box;cursor:pointer;white-space:nowrap;padding:5px 10px;border-radius:99px;border:1px dashed var(--line-2);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.hint:hover{border-style:solid;border-color:var(--ink-2);color:var(--ink)}
.hint:focus-visible{outline:3px solid var(--brick)}
.cmd-msg{font-size:13.5px;color:var(--ink-2);margin:8px 2px 0;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.cmd-msg:empty{display:none}
.cmd-msg .ic{width:16px;height:16px;margin-top:2px;color:var(--ok)}
.cmd-msg.warn .ic{color:var(--brick-ink)}
.cmd-msg ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.pv-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 10px;flex-wrap:wrap}
.pv-frame{position:relative;height:calc(100vh - 300px);min-height:440px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background-color:var(--sunk);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:20px 20px}
.pv-frame.flash::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 3px var(--brick);animation:flash .9s ease forwards;pointer-events:none;z-index:5}
@keyframes flash{from{opacity:1}to{opacity:0}}
.pv-stage{position:absolute;top:0;left:0;transform-origin:0 0;background:#fff}
.pv-frame.phone .pv-stage{border-radius:26px;box-shadow:0 0 0 8px #1A1D2D,0 26px 50px -20px rgba(0,0,0,.55);overflow:hidden}
.pv-host{display:block;width:100%;height:100%;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.pv-frame.phone .pv-host{border-radius:26px;clip-path:inset(0 round 26px)}
.grp{border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;font-weight:700;font-size:14.5px;color:var(--ink)}
.grp>summary .ic{width:17px;height:17px;color:var(--muted)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.grp[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.grp>summary:hover{background:var(--sunk)}
.grp>summary:focus-visible{outline:3px solid var(--brick);outline-offset:-3px}
.gb{padding:2px 18px 18px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.in{font:inherit;font-weight:400;font-size:14.5px;color:var(--ink);background:var(--sunk);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;min-height:40px;width:100%}
.in:focus{outline:none;border-color:var(--brick);box-shadow:0 0 0 3px var(--ring);background:var(--sheet)}
textarea.in{min-height:78px;resize:vertical;line-height:1.45}
select.in{appearance:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lab{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:-4px}
